name: QA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-qa:
    name: Docker QA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run QA
        run: docker compose run --rm qa

      - name: Checkout ARD spec for conformance
        if: ${{ vars.ARD_CONFORMANCE_BASE_URL != '' }}
        uses: actions/checkout@v4
        with:
          repository: ards-project/ard-spec
          path: tools/ard-spec

      - name: Run ARD conformance
        if: ${{ vars.ARD_CONFORMANCE_BASE_URL != '' }}
        run: docker compose run --rm qa bin/ard-conformance.sh "${{ vars.ARD_CONFORMANCE_BASE_URL }}"
