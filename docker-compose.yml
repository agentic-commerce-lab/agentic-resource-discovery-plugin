services:
  qa:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
    command: composer qa

  test:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
    command: composer test

  shell:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
    command: sh
    profiles:
      - dev

  conformance:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
    entrypoint: ["bin/ard-conformance.sh"]
    profiles:
      - dev

volumes:
  composer-cache:
